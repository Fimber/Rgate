<div id="componentRows">
  {% for c in components %}
  <div class="component-row">
    <label>Name<input name="component_name" value="{{ c.name }}" required></label>
    <label>Max<input name="component_max" type="number" min="1" max="1000" value="{{ c.max_score }}" required></label>
    <button type="button" class="btn ghost small component-remove">Remove</button>
  </div>
  {% empty %}
  <div class="component-row">
    <label>Name<input name="component_name" value="CA1" required></label>
    <label>Max<input name="component_max" type="number" min="1" max="1000" value="10" required></label>
    <button type="button" class="btn ghost small component-remove">Remove</button>
  </div>
  <div class="component-row">
    <label>Name<input name="component_name" value="CA2" required></label>
    <label>Max<input name="component_max" type="number" min="1" max="1000" value="10" required></label>
    <button type="button" class="btn ghost small component-remove">Remove</button>
  </div>
  <div class="component-row">
    <label>Name<input name="component_name" value="Exam" required></label>
    <label>Max<input name="component_max" type="number" min="1" max="1000" value="80" required></label>
    <button type="button" class="btn ghost small component-remove">Remove</button>
  </div>
  {% endfor %}
</div>
<p class="help" id="componentTotal">Scores are out of {{ component_total|default:100 }}.</p>
<div class="toolbar-actions">
  <button type="button" class="btn ghost" id="addComponent">Add component</button>
  <button class="btn primary" type="submit">{{ save_label|default:"Save components" }}</button>
</div>
<template id="componentRowTemplate">
  <div class="component-row">
    <label>Name<input name="component_name" value="" placeholder="CA3" required></label>
    <label>Max<input name="component_max" type="number" min="1" max="1000" value="10" required></label>
    <button type="button" class="btn ghost small component-remove">Remove</button>
  </div>
</template>
